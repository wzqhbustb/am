[package]
name = "pg-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "pg_rust engine — top-level assembly of storage, txn, catalog, and AMs"

[dependencies]
pg-storage = { path = "../pg-storage" }
pg-txn = { path = "../pg-txn" }
pg-catalog = { path = "../pg-catalog" }
pg-am-heap = { path = "../pg-am-heap" }
pg-am-btree = { path = "../pg-am-btree" }

# error types
thiserror = "2"

# serialization
serde = { version = "1", features = ["derive"] }
